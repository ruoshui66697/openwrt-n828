name: 构建 N828 固件 (3G300M套壳版)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 📥 拉取配置仓库代码
        uses: actions/checkout@v4

      - name: 🛠️ 安装 GCC10 并强制设为默认
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-10 g++-10 python2
          
          # 暴力替换，不依赖 alternatives
          sudo rm -f /usr/bin/gcc /usr/bin/g++ /usr/bin/gcc-ar /usr/bin/gcc-nm /usr/bin/gcc-ranlib
          sudo ln -s /usr/bin/gcc-10 /usr/bin/gcc
          sudo ln -s /usr/bin/g++-10 /usr/bin/g++
          sudo ln -s /usr/bin/gcc-ar-10 /usr/bin/gcc-ar
          sudo ln -s /usr/bin/gcc-nm-10 /usr/bin/gcc-nm
          sudo ln -s /usr/bin/gcc-ranlib-10 /usr/bin/gcc-ranlib
          
          echo "=== GCC 验证 ==="
          gcc --version | head -1
          g++ --version | head -1
          readlink -f /usr/bin/gcc
          readlink -f /usr/bin/g++

      - name: 📦 下载 OpenWrt 19.07.2 源码
        run: |
          git clone --branch v19.07.2 --depth 1 https://git.openwrt.org/openwrt/openwrt.git source

      # 【核心修复】直接查看并暴力重写 GCC 版本检查逻辑
      - name: 🔧 暴力修补 prereq-build.mk 的 GCC 检查
        run: |
          PREREQ="source/include/prereq-build.mk"
          
          echo "=== 修补前：GCC 检查相关行 ==="
          grep -n -i "gcc\|GCC_VERSION\|4\.8\|408" "$PREREQ" || echo "(未找到匹配行)"
          
          # 直接将所有 GCC/G++ 版本检查函数替换为永远返回 true
          # OpenWrt 19.07 使用 $(eval $(call TestHostCommand,xxx,...)) 格式
          python3 << 'PYEOF'
          import re
          
          with open("source/include/prereq-build.mk", "r") as f:
              content = f.read()
          
          # 将 gcc 和 g++ 的版本检查命令替换为 "true"（永远成功）
          # 匹配模式：$(call TestHostCommand,working-gcc, ..., <实际检查命令>)
          # 我们保留 check 名称但把命令换成 true
          content = re.sub(
              r'(\$\((?:eval\s+)?\$\(\s*call\s+TestHostCommand\s*,\s*(?:working-)?gcc\s*,[^,]*,)\s*[^)]+\)',
              r'\1 true)',
              content
          )
          content = re.sub(
              r'(\$\((?:eval\s+)?\$\(\s*call\s+TestHostCommand\s*,\s*(?:working-)?g\+\+\s*,[^,]*,)\s*[^)]+\)',
              r'\1 true)',
              content
          )
          
          # 同时处理 Build dependency 提示行，将其注释掉
          content = re.sub(
              r'^(\s*\$\(error\s+Build dependency:.*[Gg][Cc][Cc].*)$',
              r'# \1',
              content,
              flags=re.MULTILINE
          )
          
          with open("source/include/prereq-build.mk", "w") as f:
              f.write(content)
          
          print("✅ prereq-build.mk 已暴力修补")
          PYEOF
          
          echo "=== 修补后：GCC 检查相关行 ==="
          grep -n -i "gcc\|g++" "$PREREQ" | head -20

      - name: 🔌 注入 N828 设备树
        run: |
          cp dts/rt3052_n828.dts source/target/linux/ramips/dts/3G300M.dts

      - name: ⚙️ 生成编译配置
        run: |
          cd source
          # 编译前再次确认 gcc 版本
          echo "=== 编译前 GCC 确认 ==="
          gcc --version | head -1
          
          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_rt305x=y
          CONFIG_TARGET_ramips_rt305x_DEVICE_3g300m=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-proto-3g=y
          CONFIG_STRIP_KERNEL_EXPORTS=y
          CONFIG_USE_MKLIBS=y
          EOF
          make defconfig 2>&1 | tee ../build.log

      - name: 🌐 预下载软件包
        run: |
          cd source
          make download -j$(nproc) V=s 2>&1 | tee -a ../build.log

      - name: 🔥 编译固件并验证产物
        run: |
          cd source
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee -a ../build.log
          
          echo "🔍 检查编译产物..."
          if [ ! -d "bin/targets/ramips" ]; then
            echo "❌ 未生成 ramips 目录"
            ls -laR bin/targets/ 2>/dev/null || echo "(bin/targets 不存在)"
            exit 1
          fi
          COUNT=$(find bin/targets/ramips -name "*sysupgrade.bin" | wc -l)
          [ "$COUNT" -eq 0 ] && { echo "❌ 无 sysupgrade.bin"; find bin/targets/ramips -type f | head -20; exit 1; }
          echo "✅ 找到 $COUNT 个固件"

      - name: 🚨 提取错误日志
        if: failure()
        run: |
          [ ! -f build.log ] && exit 0
          grep -iE "(error|failed|make\[[0-9]+\]: \*\*\*|dependency|Prerequisite)" -B 3 -A 3 build.log > error_snippet.log || tail -100 build.log > error_snippet.log
          cat error_snippet.log

      - name: 📤 上传错误日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ❌ 编译错误日志
          path: error_snippet.log

      - name: 🏷️ 重命名固件
        if: success()
        run: |
          DIR=$(find source/bin/targets/ramips -maxdepth 1 -type d | grep -v "^source/bin/targets/ramips$" | head -1)
          [ -z "$DIR" ] && exit 1
          cd "$DIR"
          N=0; for f in *3g300m*; do [ -e "$f" ] && mv "$f" "${f//3g300m/n828}" && N=$((N+1)); done
          [ "$N" -eq 0 ] && { ls -la; exit 1; }
          echo "✅ 重命名 $N 个文件"

      - name: 📤 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-n828-firmware
          path: source/bin/targets/ramips/*/*n828*sysupgrade.bin
