name: 构建 N828 固件 (3G300M套壳版)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 📥 第一步：拉取配置仓库代码
        uses: actions/checkout@v4

      - name: 🛠️ 第二步：安装旧版编译依赖(Python2/GCC10)
        run: |
          echo "👉 正在安装 Python2 和 GCC10 以兼容 OpenWrt 19.07..."
          sudo apt-get update
          sudo apt-get install -y python2 gcc-10 g++-10
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          echo "✅ 旧版依赖安装完成"

      - name: 📦 第三步：下载 OpenWrt 19.07.2 源码
        run: |
          echo "👉 正在克隆 OpenWrt v19.07.2 官方源码..."
          git clone --branch v19.07.2 --depth 1 https://git.openwrt.org/openwrt/openwrt.git source
          echo "✅ 源码下载完成"
          
      - name: 🔌 第四步：将N828设备树注入3G300M外壳
        run: |
          echo "👉 正在用 N828 DTS 覆盖 3G300M 原始 DTS..."
          cp dts/rt3052_n828.dts source/target/linux/ramips/dts/3G300M.dts
          echo "✅ 设备树注入成功"

      - name: ⚙️ 第五步：生成基于3G300M的编译配置
        run: |
          echo "👉 正在写入 .config 并解析依赖..."
          cd source
          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_rt305x=y
          CONFIG_TARGET_ramips_rt305x_DEVICE_3g300m=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-proto-3g=y
          CONFIG_STRIP_KERNEL_EXPORTS=y
          CONFIG_USE_MKLIBS=y
          EOF
          make defconfig
          echo "✅ 编译配置生成完毕"

      - name: 🌐 第六步：预下载所有软件包源码
        run: |
          echo "👉 正在并发下载所需软件包..."
          cd source
          make download -j$(nproc) V=s
          echo "✅ 软件包下载完成"

      # 【关键修复】确保 FORCE=1 作为 Make 变量正确传递
      - name: 🔥 第七步：强制跳过过时检查并开始编译固件
        id: compile
        run: |
          echo "👉 使用 FORCE=1 跳过旧版检测，正式开始编译..."
          echo "⚠️ 编译日志已保存至 build.log，失败时将自动提取错误片段"
          cd source
          # 注意：FORCE=1 必须紧跟在 make 后面，且不能被管道吞掉
          make FORCE=1 -j$(nproc) V=s 2>&1 | tee ../build.log
          echo "✅ 固件编译完成"

      # 【优化】无论哪一步失败都尝试提取日志
      - name: 🚨 第八步(仅失败时触发)：提取并上传关键错误日志
        if: failure()
        run: |
          echo "❌ 构建失败！正在提取关键错误信息..."
          LOG_FILE="../build.log"
          
          # 如果 build.log 不存在（说明在编译前就失败了），尝试找其他日志
          if [ ! -f "$LOG_FILE" ]; then
            echo "⚠️ build.log 未找到，可能在前置步骤失败"
            exit 0
          fi
          
          # 提取错误上下文
          grep -iE "(error|failed|make\[[0-9]+\]: \*\*\*|Build dependency)" -B 5 -A 5 "$LOG_FILE" > error_snippet.log || true
          
          # 兜底：最后100行
          if [ ! -s error_snippet.log ]; then
            echo "⚠️ 未匹配到明确错误关键字，截取最后100行日志..."
            tail -n 100 "$LOG_FILE" > error_snippet.log
          fi
          
          echo "===== 错误摘要预览 ====="
          cat error_snippet.log
          echo "========================"

      - name: 📤 第九步(仅失败时触发)：上传错误日志片段
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ❌ 编译错误日志片段
          path: error_snippet.log

      - name: 🏷️ 第十步：将产物从3G300M重命名为N828
        if: success()
        run: |
          echo "👉 正在重命名最终固件文件..."
          cd source/bin/targets/ramips/rt305x
          for f in *3g300m*; do
            mv "$f" "${f//3g300m/n828}"
          done
          echo "✅ 固件已成功重命名为 n828"

      - name: 📤 第十一步：上传N828固件到Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-n828-firmware
          path: source/bin/targets/ramips/rt305x/*n828*sysupgrade.bin
