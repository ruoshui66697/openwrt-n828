name: Build OpenWrt for N828 (3G300M Shell)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v4

      # 【Hotfix 1】安装 Python 2 和必要的兼容依赖
      - name: Install Legacy Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 gcc-10 g++-10
          # 创建 python -> python2 软链接，骗过 OpenWrt 旧版检测脚本
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          echo "✅ Legacy dependencies installed and symlinked."

      - name: Clone OpenWrt 19.07.2 Source
        run: |
          git clone --branch v19.07.2 --depth 1 https://git.openwrt.org/openwrt/openwrt.git source
          
      - name: Inject N828 DTS into 3G300M Shell
        run: |
          cp dts/rt3052_n828.dts source/target/linux/ramips/dts/3G300M.dts
          echo "✅ DTS injection complete. 3G300M shell now uses N828 hardware definition."

      - name: Generate .config Based on 3G300M
        run: |
          cd source
          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_rt305x=y
          CONFIG_TARGET_ramips_rt305x_DEVICE_3g300m=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-proto-3g=y
          CONFIG_STRIP_KERNEL_EXPORTS=y
          CONFIG_USE_MKLIBS=y
          EOF
          make defconfig

      - name: Download Packages
        run: |
          cd source
          make download -j$(nproc) V=s

      # 【Hotfix 2】使用 FORCE=1 跳过过时的 prereq 检查
      - name: Compile Firmware
        run: |
          cd source
          make -j$(nproc) V=s FORCE=1

      - name: Rename Output to N828
        run: |
          cd source/bin/targets/ramips/rt305x
          for f in *3g300m*; do
            mv "$f" "${f//3g300m/n828}"
          done
          echo "✅ Firmware renamed from 3g300m to n828"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-n828-firmware
          path: source/bin/targets/ramips/rt305x/*n828*sysupgrade.bin
