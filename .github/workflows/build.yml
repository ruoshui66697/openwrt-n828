name: 构建 N828 固件 (3G300M套壳版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
        FORCE_UNSAFE_CONFIGURE: "1"
        OPENWRT_MIRROR: "https://sources.openwrt.org"

    steps:
      - name: 📥 拉取配置仓库代码
        uses: actions/checkout@v4

      - name: 🛠️ 安装编译依赖
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            build-essential libncurses5-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python2 python3 file \
            curl ca-certificates
      - name: 📦 下载 OpenWrt 19.07.2 源码
        shell: bash
        run: |
          git clone --branch v19.07.2 --depth 1 https://git.openwrt.org/openwrt/openwrt.git source
      - name: 🔌 注入设备树 & 配置 & 打补丁 & 修复下载源
        shell: bash
        run: |
          cp dts/rt3052_n828.dts source/target/linux/ramips/dts/3G300M.dts
          cd source
          
          # ========== 新增：下载并校验 rt2x00 memmove 性能优化补丁 ==========
          echo "=== 下载 606-rt2x00_no_realign.patch ==="
          wget -q -O package/kernel/mac80211/patches/606-rt2x00_no_realign.patch \
            "https://git.openwrt.org/openwrt/staging/adrian/patch/?id=2683b5b15de6b1fce7e1e6d84694c7cc441f0e49"
          
          # 校验补丁文件是否完整（该补丁文件总长 67 行[reference:2]，且必含 diff 标志）
          if ! head -5 package/kernel/mac80211/patches/606-rt2x00_no_realign.patch | grep -q "diff --git"; then
            echo "❌ 补丁下载异常，请检查网络或链接"
            head -10 package/kernel/mac80211/patches/606-rt2x00_no_realign.patch
            exit 1
          fi
          echo "✅ 补丁下载并校验成功"
          # ==================================================================

          # 修改默认 LAN IP 为 192.168.10.1
          sed -i 's/192\.168\.1\.1/192.168.10.1/g' package/base-files/files/bin/config_generate
          # 【关键】LuCI 和无线包都在 feeds 中，必须先更新并安装
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 修复下载源
          sed -i '1a push @mirrors, "https://sources.openwrt.org";' scripts/download.pl
          sed -i '1a push @mirrors, "https://downloads.openwrt.org/releases/19.07.2/targets/ramips/rt305x/";' scripts/download.pl
          
          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_rt305x=y
          CONFIG_TARGET_ramips_rt305x_DEVICE_3g300m=y
          # ========== 无线支持 (扫描/加入网络) ==========
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_libiwinfo-lua=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_wpad-basic=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          # ========== Web 服务：必须显式选 uhttpd ==========
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_firewall=y
          
          # ========== LuCI (使用具体组件，绝不选 luci 元包) ==========
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-compat=y
          # ========== USB：保留核心/控制器，仅移除应用层功能 ==========
          CONFIG_PACKAGE_kmod-usb-core=y
          # CONFIG_PACKAGE_kmod-usb-serial is not set
          # CONFIG_PACKAGE_kmod-usb-serial-option is not set
          # CONFIG_PACKAGE_kmod-usb-storage is not set
          # CONFIG_PACKAGE_usb-modeswitch is not set
          
          # ========== 彻底移除 PPP / 3G 及其绑定 ==========
          # CONFIG_PACKAGE_comgt is not set
          # CONFIG_PACKAGE_luci-proto-3g is not set
          # CONFIG_PACKAGE_luci-proto-ppp is not set
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_ppp-mod-pppoe is not set
          # CONFIG_PACKAGE_ppp-mod-pppol2tp is not set
          # CONFIG_PACKAGE_ppp-mod-pptp is not set
          # CONFIG_PACKAGE_kmod-ppp is not set
          # CONFIG_PACKAGE_kmod-pppoe is not set
          # CONFIG_PACKAGE_kmod-pppox is not set
          # CONFIG_PACKAGE_kmod-pppol2tp is not set
          # CONFIG_PACKAGE_kmod-pptp is not set
          # ========== 其他 ==========
          CONFIG_STRIP_KERNEL_EXPORTS=y
          CONFIG_USE_MKLIBS=y
          # CONFIG_PACKAGE_b43-firmware is not set
          # CONFIG_PACKAGE_zd1211-firmware is not set
          EOF
          make defconfig
      - name: 🔥 编译固件 (含下载)
        shell: bash
        run: |
          cd source
          set -o pipefail
          echo "=== 开始下载 ==="
          make download -j$(nproc) V=s 2>&1 | tee -a ../build.log
          echo "=== 开始编译 ==="
          make -j$(nproc) V=s 2>&1 | tee -a ../build.log
          COUNT=$(find bin/targets/ramips -name "*sysupgrade.bin" 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ 未生成固件"
            find bin/targets/ramips -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "✅ 成功生成 $COUNT 个固件"
      - name: 🚨 提取错误日志
        if: failure()
        shell: bash
        run: |
          [ ! -f build.log ] && exit 0
          grep -iE "(error|failed|make\[[0-9]+\]: \*\*\*)" -B 3 -A 3 build.log > error_snippet.log || tail -100 build.log > error_snippet.log
          cat error_snippet.log
      - name: 📤 上传错误日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ❌ 编译错误日志
          path: error_snippet.log

      - name: 🏷️ 重命名并上传固件
        if: success()
        shell: bash
        run: |
          DIR=$(find source/bin/targets/ramips -maxdepth 1 -type d | grep -v "^source/bin/targets/ramips$" | head -1)
          [ -z "$DIR" ] && exit 1
          cd "$DIR"
          for f in *3g300m*; do [ -e "$f" ] && mv "$f" "${f//3g300m/n828}"; done
      - name: 📤 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-n828-firmware
          path: source/bin/targets/ramips/*/*n828*sysupgrade.bin
