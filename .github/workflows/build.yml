name: 构建 N828 固件 (3G300M套壳版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 拉取配置仓库代码
        uses: actions/checkout@v4

      - name: 🛠️ 安装编译依赖 (含 curl)
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            build-essential libncurses5-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python2 python3 file \
            curl ca-certificates
          
          echo "=== 环境验证 ==="
          gcc --version | head -1
          curl --version | head -1

      - name: 📦 下载 OpenWrt 19.07.2 源码
        shell: bash
        run: |
          git clone --branch v19.07.2 --depth 1 https://git.openwrt.org/openwrt/openwrt.git source

      - name: 🔌 注入 N828 设备树
        shell: bash
        run: |
          cp dts/rt3052_n828.dts source/target/linux/ramips/dts/3G300M.dts

      - name: ⚙️ 生成编译配置
        shell: bash
        run: |
          cd source
          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_rt305x=y
          CONFIG_TARGET_ramips_rt305x_DEVICE_3g300m=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-proto-3g=y
          CONFIG_STRIP_KERNEL_EXPORTS=y
          CONFIG_USE_MKLIBS=y
          # 禁用 N828 不需要的 Broadcom WiFi 固件，避免下载超时
          # CONFIG_PACKAGE_b43-firmware is not set
          EOF
          make defconfig 2>&1 | tee ../build.log

      - name: 🌐 预下载软件包 (注入存档镜像源)
        shell: bash
        run: |
          cd source
          # 将已失效的上游源替换为 OpenWrt 官方存档镜像
          sed -i 's|https://downloads.sourceforge.net|https://sourceforge.mirrorservice.org|g' scripts/download.pl
          sed -i 's|http://ftp.de.debian.org|https://deb.debian.org|g' scripts/download.pl
          sed -i 's|http://ftp.acc.umu.se|https://ftp.gnome.org|g' scripts/download.pl
          sed -i 's|http://www.lwfinger.com|https://sources.openwrt.org|g' scripts/download.pl
          
          make download -j$(nproc) V=s 2>&1 | tee -a ../build.log

      - name: 🔥 编译固件并验证产物
        shell: bash
        run: |
          cd source
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee -a ../build.log
          
          echo "🔍 检查编译产物..."
          if [ ! -d "bin/targets/ramips" ]; then
            echo "❌ 未生成 ramips 目录"
            ls -laR bin/targets/ 2>/dev/null || echo "(bin/targets 不存在)"
            exit 1
          fi
          COUNT=$(find bin/targets/ramips -name "*sysupgrade.bin" | wc -l)
          if [ "$COUNT" -eq 0 ]; then 
            echo "❌ 无 sysupgrade.bin"
            find bin/targets/ramips -type f | head -20
            exit 1
          fi
          echo "✅ 找到 $COUNT 个固件"

      - name: 🚨 提取错误日志
        if: failure()
        shell: bash
        run: |
          [ ! -f build.log ] && exit 0
          grep -iE "(error|failed|make\[[0-9]+\]: \*\*\*)" -B 3 -A 3 build.log > error_snippet.log || tail -100 build.log > error_snippet.log
          cat error_snippet.log

      - name: 📤 上传错误日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ❌ 编译错误日志
          path: error_snippet.log

      - name: 🏷️ 重命名固件
        if: success()
        shell: bash
        run: |
          DIR=$(find source/bin/targets/ramips -maxdepth 1 -type d | grep -v "^source/bin/targets/ramips$" | head -1)
          [ -z "$DIR" ] && exit 1
          cd "$DIR"
          N=0
          for f in *3g300m*; do 
            [ -e "$f" ] && mv "$f" "${f//3g300m/n828}" && N=$((N+1))
          done
          [ "$N" -eq 0 ] && { ls -la; exit 1; }
          echo "✅ 重命名 $N 个文件"

      - name: 📤 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-n828-firmware
          path: source/bin/targets/ramips/*/*n828*sysupgrade.bin
