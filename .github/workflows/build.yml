name: 构建 N828 固件 (3G300M套壳版-网桥精简)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
        FORCE_UNSAFE_CONFIGURE: "1"
        OPENWRT_MIRROR: "https://sources.openwrt.org"

    steps:
      - name: 拉取配置仓库代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            build-essential libncurses5-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python2 python3 file \
            curl ca-certificates

      - name: 下载 OpenWrt 19.07.2 源码
        shell: bash
        run: |
          git clone --branch v19.07.2 --depth 1 https://git.openwrt.org/openwrt/openwrt.git source

      - name: 注入设备树、配置、下载源修复与首次启动脚本
        shell: bash
        run: |
          cp dts/rt3052_n828.dts source/target/linux/ramips/dts/3G300M.dts
          cd source

          # 将官方归档源插入 download.pl 的最优先位置
          sed -i '1a push @mirrors, "https://sources.openwrt.org";' scripts/download.pl
          sed -i '1a push @mirrors, "https://downloads.openwrt.org/releases/19.07.2/targets/ramips/rt305x/";' scripts/download.pl

          # 写入首次启动固化脚本：固定 LAN IP、补全 DHCP、修复 uhttpd
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-fix-lan-dhcp-web << 'UCIDEF'
          #!/bin/sh
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.10.1'
          uci set network.lan.netmask='255.255.255.0'
          uci delete network.lan.gateway 2>/dev/null
          uci delete network.lan.dns 2>/dev/null
          uci commit network

          uci set dhcp.lan=dhcp
          uci set dhcp.lan.interface='lan'
          uci set dhcp.lan.start='100'
          uci set dhcp.lan.limit='150'
          uci set dhcp.lan.leasetime='12h'
          uci delete dhcp.lan.ignore 2>/dev/null
          uci commit dhcp

          if ! grep -q "config uhttpd" /etc/config/uhttpd 2>/dev/null; then
            mkdir -p /etc/config
            cat > /etc/config/uhttpd << 'UHTTPD'
          config uhttpd main
              list listen_http 0.0.0.0:80
              option home /www
              option rfc1918_filter 0
              option index_page luci
          UHTTPD
          fi

          /etc/init.d/network restart
          /etc/init.d/dnsmasq restart
          /etc/init.d/uhttpd restart
          UCIDEF
          chmod +x files/etc/uci-defaults/99-fix-lan-dhcp-web

          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_rt305x=y
          CONFIG_TARGET_ramips_rt305x_DEVICE_3g300m=y

          # USB 串口
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y

          # Web 管理
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y

          # DHCP/DNS
          CONFIG_PACKAGE_dnsmasq=y

          # 防火墙
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-conntrack=y

          # 无线
          CONFIG_PACKAGE_kmod-rt2800-soc=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_wpad-basic=y

          # 系统基础
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-rrdns=y
          CONFIG_PACKAGE_ubus=y
          CONFIG_PACKAGE_ubusd=y
          CONFIG_PACKAGE_uci=y

          # 彻底移除
          # CONFIG_IPV6 is not set
          # CONFIG_PACKAGE_luci-proto-ipv6 is not set
          # CONFIG_PACKAGE_odhcpd is not set
          # CONFIG_PACKAGE_odhcp6c is not set
          # CONFIG_PACKAGE_miniupnpd is not set
          # CONFIG_PACKAGE_luci-app-upnp is not set
          # CONFIG_PACKAGE_luci-app-statistics is not set
          # CONFIG_PACKAGE_collectd is not set
          # CONFIG_PACKAGE_comgt is not set
          # CONFIG_PACKAGE_luci-proto-3g is not set

          # 4MB Flash 压缩
          CONFIG_STRIP_KERNEL_EXPORTS=y
          CONFIG_USE_MKLIBS=y
          # CONFIG_PACKAGE_b43-firmware is not set
          # CONFIG_PACKAGE_zd1211-firmware is not set
          EOF
          make defconfig

      - name: 编译固件
        shell: bash
        run: |
          cd source
          set -o pipefail
          echo "=== 开始下载 ==="
          make download -j$(nproc) V=s 2>&1 | tee -a ../build.log
          echo "=== 开始编译 ==="
          make -j$(nproc) V=s 2>&1 | tee -a ../build.log

          COUNT=$(find bin/targets/ramips -name "*sysupgrade.bin" 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "未生成固件"
            find bin/targets/ramips -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "成功生成 $COUNT 个固件"

      - name: 提取错误日志
        if: failure()
        shell: bash
        run: |
          [ ! -f build.log ] && exit 0
          grep -iE "(error|failed|make\[[0-9]+\]: \*\*\*)" -B 3 -A 3 build.log > error_snippet.log || tail -100 build.log > error_snippet.log
          cat error_snippet.log

      - name: 上传错误日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-error-log
          path: error_snippet.log

      - name: 重命名并上传固件
        if: success()
        shell: bash
        run: |
          DIR=$(find source/bin/targets/ramips -maxdepth 1 -type d | grep -v "^source/bin/targets/ramips$" | head -1)
          [ -z "$DIR" ] && exit 1
          cd "$DIR"
          for f in *3g300m*; do [ -e "$f" ] && mv "$f" "${f//3g300m/n828}"; done

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-n828-firmware
          path: source/bin/targets/ramips/*/*n828*sysupgrade.bin
