name: 构建 N828 固件 (3G300M套壳版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
        FORCE_UNSAFE_CONFIGURE: "1"
        OPENWRT_MIRROR: "https://sources.openwrt.org"

    steps:
      - name: 📥 拉取配置仓库代码
        uses: actions/checkout@v4

      - name: 🛠️ 安装编译依赖
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            build-essential libncurses5-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python2 python3 file \
            curl ca-certificates

      - name: 📦 下载 OpenWrt 19.07.2 源码
        shell: bash
        run: |
          git clone --branch v19.07.2 --depth 1 https://git.openwrt.org/openwrt/openwrt.git source

      - name: 🔌 注入设备树 & 自定义配置 (IP/IPv6)
        shell: bash
        run: |
          # 1. 注入设备树
          cp dts/rt3052_n828.dts source/target/linux/ramips/dts/3G300M.dts
          cd source
          
          # 2. 建立 files 目录用于覆盖系统默认配置
          mkdir -p files/etc/sysctl.d
          mkdir -p files/etc/config
          
          # 3. 修改默认 IP 地址为 192.168.10.1
          #    默认不配置 wan6，避免开机自动拉起 IPv6
          cat > files/etc/config/network << 'EOF'
          config interface 'loopback'
              option ifname 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config globals 'globals'
              option ula_prefix 'fd8d:eec2:8e49::/48'

          config interface 'lan'
              option type 'bridge'
              option ifname 'eth0.1'
              option proto 'static'
              option ipaddr '192.168.10.1'
              option netmask '255.255.255.0'

          config interface 'wan'
              option ifname 'eth0.2'
              option proto 'dhcp'

          config switch
              option name 'switch0'
              option reset '1'
              option enable_vlan '1'

          config switch_vlan
              option device 'switch0'
              option vlan '1'
              option ports '0 1 2 3 6t'

          config switch_vlan
              option device 'switch0'
              option vlan '2'
              option ports '4 6t'
          EOF

          # 4. 运行时强制关闭 IPv6 协议栈
          #    IPv6 软件包仍然编译进固件，只是默认不启用
          cat > files/etc/sysctl.d/99-disable-ipv6.conf << 'EOF'
          net.ipv6.conf.all.disable_ipv6=1
          net.ipv6.conf.default.disable_ipv6=1
          net.ipv6.conf.lo.disable_ipv6=1
          EOF
          
          # 5. 禁用 DHCPv6 和 RA (路由通告)，不影响 IPv4
          cat > files/etc/config/dhcp << 'EOF'
          config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option localise_queries '1'
              option rebind_protection '1'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.auto'
              option localservice '1'

          config dhcp 'lan'
              option interface 'lan'
              option start '100'
              option limit '150'
              option leasetime '12h'
              option dhcpv4 'server'
              option dhcpv6 'disabled'
              option ra 'disabled'
              option ndp 'disabled'

          config dhcp 'wan'
              option interface 'wan'
              option ignore '1'
          EOF

          # 6. 更新 feeds 并修复下载源
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sed -i '1a push @mirrors, "https://sources.openwrt.org";' scripts/download.pl
          sed -i '1a push @mirrors, "https://downloads.openwrt.org/releases/19.07.2/targets/ramips/rt305x/";' scripts/download.pl
          
          # 7. 生成编译配置文件
          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_rt305x=y
          CONFIG_TARGET_ramips_rt305x_DEVICE_3g300m=y
          
          # ========== 无线支持 (扫描/加入网络) ==========
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_libiwinfo-lua=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_wpad-basic=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          
          # ========== Web 服务：必须显式选 uhttpd ==========
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          
          # ========== LuCI (使用具体组件，绝不选 luci 元包) ==========
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-compat=y
          
          # ========== IPv6：编译进固件，但默认不启用 ==========
          CONFIG_PACKAGE_odhcpd=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-ip6tables=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          
          # ========== USB：全部移除 ==========
          # CONFIG_PACKAGE_kmod-usb-core is not set
          # CONFIG_PACKAGE_kmod-usb-ohci is not set
          # CONFIG_PACKAGE_kmod-usb2 is not set
          # CONFIG_PACKAGE_kmod-usb-serial is not set
          # CONFIG_PACKAGE_kmod-usb-serial-option is not set
          # CONFIG_PACKAGE_kmod-usb-storage is not set
          # CONFIG_PACKAGE_usb-modeswitch is not set
          
          # ========== 彻底移除 PPP / 3G 及其绑定 ==========
          # CONFIG_PACKAGE_comgt is not set
          # CONFIG_PACKAGE_luci-proto-3g is not set
          # CONFIG_PACKAGE_luci-proto-ppp is not set
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_ppp-mod-pppoe is not set
          # CONFIG_PACKAGE_ppp-mod-pppol2tp is not set
          # CONFIG_PACKAGE_ppp-mod-pptp is not set
          # CONFIG_PACKAGE_kmod-ppp is not set
          # CONFIG_PACKAGE_kmod-pppoe is not set
          # CONFIG_PACKAGE_kmod-pppox is not set
          # CONFIG_PACKAGE_kmod-pppol2tp is not set
          # CONFIG_PACKAGE_kmod-pptp is not set
          
          # ========== 内存优化 ==========
          CONFIG_STRIP_KERNEL_EXPORTS=y
          CONFIG_USE_MKLIBS=y
          # CONFIG_PACKAGE_b43-firmware is not set
          # CONFIG_PACKAGE_zd1211-firmware is not set
          EOF
          make defconfig

      - name: 🔥 编译固件 (含下载)
        shell: bash
        run: |
          cd source
          set -o pipefail
          echo "=== 开始下载 ==="
          make download -j$(nproc) V=s 2>&1 | tee -a ../build.log
          echo "=== 开始编译 ==="
          make -j$(nproc) V=s 2>&1 | tee -a ../build.log
          
          COUNT=$(find bin/targets/ramips -name "*sysupgrade.bin" 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then 
            echo "❌ 未生成固件"
            find bin/targets/ramips -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "✅ 成功生成 $COUNT 个固件"

      - name: 🚨 提取错误日志
        if: failure()
        shell: bash
        run: |
          [ ! -f build.log ] && exit 0
          grep -iE "(error|failed|make\[[0-9]+\]: \*\*\*)" -B 3 -A 3 build.log > error_snippet.log || tail -100 build.log > error_snippet.log
          cat error_snippet.log

      - name: 📤 上传错误日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ❌ 编译错误日志
          path: error_snippet.log

      - name: 🏷️ 重命名并上传固件
        if: success()
        shell: bash
        run: |
          DIR=$(find source/bin/targets/ramips -maxdepth 1 -type d | grep -v "^source/bin/targets/ramips$" | head -1)
          [ -z "$DIR" ] && exit 1
          cd "$DIR"
          for f in *3g300m*; do [ -e "$f" ] && mv "$f" "${f//3g300m/n828}"; done
          
      - name: 📤 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-n828-firmware
          path: source/bin/targets/ramips/*/*n828*sysupgrade.bin
